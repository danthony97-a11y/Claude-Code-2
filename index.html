<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pocket Battle — A Simple Pokémon Game</title>
<style>
  :root {
    --bg: #2b2d42;
    --panel: #edf2f4;
    --accent: #ef233c;
    --accent-dark: #d90429;
    --ink: #2b2d42;
    --grass: #6abe30;
    --hp-good: #3bd16f;
    --hp-mid: #f6c945;
    --hp-low: #ef233c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #3a3d5c, var(--bg));
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    padding: 16px;
  }
  .game {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border-radius: 18px;
    box-shadow: 0 18px 50px rgba(0,0,0,.45);
    overflow: hidden;
    border: 4px solid #1b1d2e;
  }
  header {
    background: var(--accent);
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 1.15rem; margin: 0; letter-spacing: .5px; }
  header .pokeball {
    width: 26px; height: 26px; border-radius: 50%;
    background: linear-gradient(#fff 0 50%, var(--accent-dark) 50% 100%);
    border: 3px solid #1b1d2e; position: relative;
  }
  header .pokeball::after {
    content: ""; position: absolute; inset: 0; margin: auto;
    width: 8px; height: 8px; border-radius: 50%;
    background: #fff; border: 3px solid #1b1d2e;
  }
  .arena {
    background: linear-gradient(#bfe3ff 0 60%, var(--grass) 60% 100%);
    padding: 18px 20px 26px;
    position: relative;
  }
  .combatant { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .combatant.enemy { justify-content: flex-start; }
  .combatant.player { justify-content: flex-end; flex-direction: row-reverse; }
  .sprite {
    font-size: 56px;
    filter: drop-shadow(2px 4px 2px rgba(0,0,0,.25));
    transition: transform .12s;
  }
  .sprite.hit { animation: shake .35s; }
  @keyframes shake {
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-6px)}
    75%{transform:translateX(6px)}
  }
  .infocard {
    background: rgba(255,255,255,.92);
    border: 2px solid #1b1d2e;
    border-radius: 10px;
    padding: 8px 12px;
    min-width: 200px;
  }
  .infocard .name { font-weight: bold; display: flex; justify-content: space-between; }
  .infocard .lvl { font-size: .8rem; opacity: .7; }
  .hpbar {
    height: 12px; background: #d0d0d0; border-radius: 8px;
    overflow: hidden; margin-top: 6px; border: 1px solid #999;
  }
  .hpfill { height: 100%; width: 100%; background: var(--hp-good); transition: width .4s, background .4s; }
  .hptext { font-size: .75rem; text-align: right; margin-top: 2px; }
  .console {
    background: #fff;
    border-top: 4px solid #1b1d2e;
    padding: 14px 18px;
  }
  .log {
    min-height: 56px;
    font-size: .95rem;
    line-height: 1.4;
    margin-bottom: 12px;
  }
  .moves {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  button.move {
    border: 2px solid #1b1d2e;
    background: var(--panel);
    border-radius: 10px;
    padding: 12px;
    font-size: .95rem;
    font-weight: bold;
    cursor: pointer;
    text-align: left;
    transition: transform .08s, background .15s;
  }
  button.move small { display:block; font-weight: normal; opacity:.65; font-size:.72rem; }
  button.move:hover:not(:disabled) { background: #fff; transform: translateY(-2px); }
  button.move:disabled { opacity: .45; cursor: not-allowed; }
  .type-tag { font-size:.65rem; padding:1px 6px; border-radius:6px; color:#fff; }
  .t-fire{background:#f08030}.t-water{background:#6890f0}.t-grass{background:#78c850}.t-normal{background:#a8a878}
  .restart {
    width: 100%; margin-top: 10px;
    background: var(--accent); color:#fff; border:none;
    padding: 12px; border-radius: 10px; font-weight: bold;
    cursor: pointer; font-size: 1rem; display:none;
  }
  .picker { padding: 20px; text-align:center; }
  .picker h2 { margin-top: 0; }
  .choices { display:grid; grid-template-columns: repeat(3,1fr); gap:12px; margin-top:14px; }
  .choice {
    border:2px solid #1b1d2e; border-radius:12px; padding:14px 8px; cursor:pointer;
    background:#fff; transition: transform .1s;
  }
  .choice:hover { transform: translateY(-3px); }
  .choice .emoji { font-size:42px; }
  .choice .pname { font-weight:bold; margin-top:6px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="game">
  <header>
    <h1>Pocket Battle</h1>
    <div class="pokeball"></div>
  </header>

  <!-- Starter picker -->
  <div class="picker" id="picker">
    <h2>Choose your partner!</h2>
    <p>Each starter has a type advantage in the classic triangle.</p>
    <div class="choices" id="choices"></div>
  </div>

  <!-- Battle screen -->
  <div id="battle" class="hidden">
    <div class="arena">
      <div class="combatant enemy">
        <div class="sprite" id="enemy-sprite">❓</div>
        <div class="infocard">
          <div class="name"><span id="enemy-name">Enemy</span> <span class="lvl">Lv5</span></div>
          <div class="hpbar"><div class="hpfill" id="enemy-hp"></div></div>
          <div class="hptext" id="enemy-hptext">100/100</div>
        </div>
      </div>
      <div class="combatant player">
        <div class="sprite" id="player-sprite">❓</div>
        <div class="infocard">
          <div class="name"><span id="player-name">You</span> <span class="lvl">Lv5</span></div>
          <div class="hpbar"><div class="hpfill" id="player-hp"></div></div>
          <div class="hptext" id="player-hptext">100/100</div>
        </div>
      </div>
    </div>
    <div class="console">
      <div class="log" id="log">A wild Pokémon appeared!</div>
      <div class="moves" id="moves"></div>
      <button class="restart" id="restart">Play Again</button>
    </div>
  </div>
</div>

<script>
// ---- Type chart (classic triangle + normal) ----
const TYPES = {
  fire:  { strong: "grass", weak: "water" },
  water: { strong: "fire",  weak: "grass" },
  grass: { strong: "water", weak: "fire"  },
  normal:{ strong: null,    weak: null    },
};

// ---- Pokémon roster ----
const DEX = {
  charmander: { name: "Charmander", emoji: "🦎", type: "fire",
    moves: [
      { name: "Ember",     type: "fire",   power: 22 },
      { name: "Scratch",   type: "normal", power: 16 },
      { name: "Flamethrower", type: "fire", power: 30 },
      { name: "Growl",     type: "normal", power: 8  },
    ]},
  squirtle: { name: "Squirtle", emoji: "🐢", type: "water",
    moves: [
      { name: "Water Gun", type: "water",  power: 22 },
      { name: "Tackle",    type: "normal", power: 16 },
      { name: "Bubble Beam", type: "water", power: 30 },
      { name: "Bite",      type: "normal", power: 8  },
    ]},
  bulbasaur: { name: "Bulbasaur", emoji: "🌿", type: "grass",
    moves: [
      { name: "Vine Whip", type: "grass",  power: 22 },
      { name: "Tackle",    type: "normal", power: 16 },
      { name: "Razor Leaf", type: "grass", power: 30 },
      { name: "Leech Seed", type: "grass", power: 12 },
    ]},
};

const MAX_HP = 100;
let player, enemy, busy = false;

// ---- DOM helpers ----
const $ = id => document.getElementById(id);
function setHP(who, cur) {
  const pct = Math.max(0, cur / MAX_HP * 100);
  const fill = $(who + "-hp");
  fill.style.width = pct + "%";
  fill.style.background = pct > 50 ? "var(--hp-good)" : pct > 20 ? "var(--hp-mid)" : "var(--hp-low)";
  $(who + "-hptext").textContent = Math.max(0, Math.round(cur)) + "/" + MAX_HP;
}
function log(msg) { $("log").innerHTML = msg; }
function hitAnim(who) {
  const s = $(who + "-sprite");
  s.classList.remove("hit"); void s.offsetWidth; s.classList.add("hit");
}

// ---- Damage with type effectiveness + small variance ----
function effectiveness(moveType, defType) {
  if (TYPES[moveType] && TYPES[moveType].strong === defType) return 2;
  if (TYPES[moveType] && TYPES[moveType].weak === defType)   return 0.5;
  return 1;
}
function calcDamage(move, defender) {
  const mult = effectiveness(move.type, defender.type);
  const variance = 0.85 + Math.random() * 0.3;
  const crit = Math.random() < 0.1 ? 1.5 : 1;
  return { dmg: Math.round(move.power * mult * variance * crit), mult, crit: crit > 1 };
}

// ---- Setup ----
function buildPicker() {
  const wrap = $("choices");
  wrap.innerHTML = "";
  Object.keys(DEX).forEach(key => {
    const p = DEX[key];
    const el = document.createElement("div");
    el.className = "choice";
    el.innerHTML = `<div class="emoji">${p.emoji}</div>
      <div class="pname">${p.name}</div>
      <span class="type-tag t-${p.type}">${p.type}</span>`;
    el.onclick = () => startGame(key);
    wrap.appendChild(el);
  });
}

function startGame(playerKey) {
  // Enemy is a random different starter for fairness
  const keys = Object.keys(DEX).filter(k => k !== playerKey);
  const enemyKey = keys[Math.floor(Math.random() * keys.length)];

  player = { ...DEX[playerKey], hp: MAX_HP };
  enemy  = { ...DEX[enemyKey],  hp: MAX_HP };

  $("picker").classList.add("hidden");
  $("battle").classList.remove("hidden");
  $("restart").style.display = "none";

  $("player-sprite").textContent = player.emoji;
  $("enemy-sprite").textContent  = enemy.emoji;
  $("player-name").textContent   = player.name;
  $("enemy-name").textContent    = enemy.name;
  setHP("player", player.hp);
  setHP("enemy", enemy.hp);
  log(`A wild <b>${enemy.name}</b> appeared! Go, <b>${player.name}</b>!`);

  renderMoves();
}

function renderMoves() {
  const wrap = $("moves");
  wrap.innerHTML = "";
  player.moves.forEach(move => {
    const b = document.createElement("button");
    b.className = "move";
    b.disabled = busy;
    b.innerHTML = `${move.name}
      <small><span class="type-tag t-${move.type}">${move.type}</span> · PWR ${move.power}</small>`;
    b.onclick = () => playerTurn(move);
    wrap.appendChild(b);
  });
}

function effText(mult) {
  if (mult > 1) return " It's super effective!";
  if (mult < 1) return " It's not very effective…";
  return "";
}

function playerTurn(move) {
  if (busy) return;
  busy = true;
  renderMoves();

  const r = calcDamage(move, enemy);
  enemy.hp -= r.dmg;
  hitAnim("enemy");
  setHP("enemy", enemy.hp);
  log(`<b>${player.name}</b> used <b>${move.name}</b>!` +
      (r.crit ? " A critical hit!" : "") + effText(r.mult));

  if (enemy.hp <= 0) return setTimeout(() => endGame(true), 700);

  setTimeout(enemyTurn, 1100);
}

function enemyTurn() {
  // Simple AI: 70% pick strongest, else random
  let move;
  if (Math.random() < 0.7) {
    move = enemy.moves.reduce((a, b) =>
      (b.power * effectiveness(b.type, player.type)) > (a.power * effectiveness(a.type, player.type)) ? b : a);
  } else {
    move = enemy.moves[Math.floor(Math.random() * enemy.moves.length)];
  }

  const r = calcDamage(move, player);
  player.hp -= r.dmg;
  hitAnim("player");
  setHP("player", player.hp);
  log(`Enemy <b>${enemy.name}</b> used <b>${move.name}</b>!` +
      (r.crit ? " A critical hit!" : "") + effText(r.mult));

  if (player.hp <= 0) return setTimeout(() => endGame(false), 700);

  busy = false;
  setTimeout(renderMoves, 400);
}

function endGame(won) {
  busy = true;
  renderMoves();
  log(won
    ? `🎉 The wild <b>${enemy.name}</b> fainted! <b>${player.name}</b> wins!`
    : `💀 <b>${player.name}</b> fainted… You lost the battle.`);
  const r = $("restart");
  r.style.display = "block";
}

$("restart").onclick = () => {
  busy = false;
  $("battle").classList.add("hidden");
  $("picker").classList.remove("hidden");
};

buildPicker();
</script>
</body>
</html>
